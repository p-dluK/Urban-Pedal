<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132b26">
<meta name="description" content="GPS de bicicleta com mapa de altitude para a Zona Leste de São Paulo.">
<title>Altitude Bike GPS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Mapa interativo"></div>

<!-- Controles Flutuantes Superiores -->
<div class="floating-controls top-controls">
  <button id="searchToggleBtn" class="float-btn" title="Buscar Endereço">🔍</button>
  <button id="heatBtn" class="float-btn active" title="Mapa Térmico de Altitude">🌡 Altitude</button>
  <button id="layersBtn" class="float-btn" title="Alternar Camadas">🗺 Camadas</button>
  <button id="locateBtn" class="float-btn" title="Minha Localização GPS">◎</button>
</div>

<!-- Legenda Flutuante -->
<div id="legend" class="legend">
  <b>ALTITUDE 700–850 m</b>
  <div class="gradient"></div>
  <div class="legend-labels">
    <span>700m</span>
    <span>775m</span>
    <span>850m</span>
  </div>
</div>

<!-- Modal / Janela Flutuante de Busca e Rota -->
<div id="searchModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Traçar Rota / Pesquisa</h3>
      <button id="closeModalBtn" class="close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="origin">PONTO A · ORIGEM</label>
        <div class="inputrow">
          <input id="origin" placeholder="Use minha localização ou toque no mapa">
          <button id="originHere" class="smallbtn">GPS</button>
        </div>
      </div>
      <div class="field">
        <label for="destination">PONTO B · DESTINO</label>
        <div class="inputrow">
          <input id="destination" placeholder="Digite um endereço ou local">
          <button id="pickDest" class="smallbtn">MAPA</button>
        </div>
        <div id="suggestions" class="suggestions"></div>
      </div>
      <div class="actions">
        <button id="routeBtn" class="primary">CALCULAR ROTA</button>
        <button id="clearBtn" class="secondary">LIMPAR</button>
      </div>
    </div>
  </div>
</div>

<!-- Painel Flutuante de Informações de Rota e Altitude (Inferior) -->
<div class="floating-info-wrap">
  <div id="status" class="status-toast">Toque no mapa para consultar altitude ou navegue pelos controles.</div>
  <div id="routeInfo" class="info-card" hidden></div>
  <div id="elevationInfo" class="info-card" hidden>
    <div class="elev-head">
      <b>COMPARADOR DE ALTITUDE</b>
      <span id="elevSource">Mapzen</span>
    </div>
    <div class="elev-grid">
      <div><small>SUA POSIÇÃO</small><strong id="currentElev">— m</strong></div>
      <div><small>PONTO TOCADO</small><strong id="selectedElev">— m</strong></div>
    </div>
    <div class="elev-diff">
      <small>DIFERENÇA</small><strong id="elevDiff">Toque em um ponto do mapa</strong>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
