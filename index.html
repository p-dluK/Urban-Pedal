<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132b26">
<meta name="description" content="GPS de bicicleta com mapa de altitude para a Zona Leste de São Paulo.">
<title>Altitude Bike GPS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png?v=5" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png?v=5">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<main>
  <!-- Mapa Fullscreen -->
  <div id="map" aria-label="Mapa interativo"></div>

  <!-- Busca recolhida por padrão para priorizar o mapa -->
  <button id="searchToggle" class="search-toggle" type="button" aria-expanded="false" aria-controls="searchPanel" title="Abrir busca">⌕ <span>BUSCAR</span></button>
  <section id="searchPanel" class="floating-panel" aria-label="Busca e rota">
    <div class="panel-heading">
      <strong style="color:var(--dark); font-size:16px;">ALTITUDE <span>BIKE</span></strong>
      <div class="panel-heading-actions">
        <button id="locateBtn" class="smallbtn" style="padding:6px 10px;" title="Minha localização" aria-label="Minha localização">📍 GPS</button>
        <button id="searchClose" class="close-panel" type="button" aria-label="Fechar busca" title="Fechar">×</button>
      </div>
    </div>
    <div class="field">
      <label for="origin">PONTO A · ORIGEM</label>
      <div class="inputrow"><input id="origin" placeholder="Use minha localização ou toque no mapa"><button id="originHere" class="smallbtn">GPS</button></div>
    </div>
    <div class="field" style="margin-top:8px;">
      <label for="destination">PONTO B · DESTINO</label>
      <div class="inputrow"><input id="destination" placeholder="Digite um endereço ou local"><button id="pickDest" class="smallbtn">MAPA</button></div>
      <div id="suggestions" class="suggestions"></div>
    </div>
    <div class="actions" style="margin-top:12px;">
      <button id="routeBtn" class="primary">CALCULAR ROTA</button>
      <button id="clearBtn" class="secondary">LIMPAR</button>
    </div>
    <div id="status" class="status">Pronto. Defina origem e destino para começar.</div>
    <div id="routeInfo" class="route-info" hidden></div>
    <div id="elevationInfo" class="elevation-card" hidden>
      <div class="elev-head"><b>COMPARADOR DE ALTITUDE</b><span id="elevSource">Mapzen / OpenTopoData</span></div>
      <div class="elev-grid"><div><small>SUA POSIÇÃO</small><strong id="currentElev">— m</strong></div><div><small>PONTO TOCADO</small><strong id="selectedElev">— m</strong></div></div>
      <div class="elev-diff"><small>DIFERENÇA</small><strong id="elevDiff">Toque em um ponto do mapa</strong></div>
    </div>
    <div class="hint">Dica: depois de calcular, toque em uma rua para inserir um ponto intermediário.</div>
  </section>

  <!-- Botões de Controle Flutuantes -->
  <div class="map-tools-floating">
    <button id="heatBtn" class="tool-btn active">🌡 Altitude</button>
    <button id="layersBtn" class="tool-btn">Camadas</button>
  </div>

  <!-- Legenda Flutuante -->
  <div id="legend" class="legend-floating">
    <b>ALTITUDE</b><div class="gradient"></div>
    <div class="legend-labels"><span>baixa (722m)</span><span>alta (820m)</span></div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="topo-layer.js?v=6"></script>
<script src="app.js?v=6"></script>
<script>
  // Atualização automática: checa ao abrir, ao voltar à aba e periodicamente.
  if ('serviceWorker' in navigator) {
    let reloadingForUpdate = false;
    const hadController = Boolean(navigator.serviceWorker.controller);

    navigator.serviceWorker.addEventListener('controllerchange', () => {
      // Não recarrega na primeira instalação; só quando uma versão substitui outra.
      if (hadController && !reloadingForUpdate) {
        reloadingForUpdate = true;
        window.location.reload();
      }
    });

    async function checkForAppUpdate() {
      try {
        const reg = await navigator.serviceWorker.getRegistration('./');
        if (reg) await reg.update();
      } catch (e) {
        console.warn('Não foi possível verificar atualização agora.', e);
      }
    }

    window.addEventListener('load', async () => {
      try {
        const reg = await navigator.serviceWorker.register('./sw.js?v=6', {
          scope: './',
          updateViaCache: 'none'
        });
        await reg.update();

        // Se uma nova versão terminar de instalar, pede ativação imediata.
        reg.addEventListener('updatefound', () => {
          const worker = reg.installing;
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              worker.postMessage('SKIP_WAITING');
            }
          });
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') checkForAppUpdate();
        });
        window.addEventListener('focus', checkForAppUpdate);
        window.addEventListener('pageshow', checkForAppUpdate);

        // Verifica a cada 60 segundos enquanto o app estiver aberto.
        window.setInterval(checkForAppUpdate, 60000);
      } catch (e) {
        console.warn('Service Worker indisponível.', e);
      }
    });
  }
</script>
</body>
</html>
