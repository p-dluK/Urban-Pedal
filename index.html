<!-- Painel do Modo Pedal / Iniciar na parte inferior (Bottom Bar unificada) -->
  <div id="pedalHudBottom" class="pedal-hud-bottom">
    <!-- Estado Inativo: Botão de Iniciar Grande -->
    <div id="startStateWrap" class="bottom-start-wrap">
      <button id="rideButton" class="bottom-btn start-big-btn">▶ INICIAR PEDALADA</button>
    </div>

    <!-- Estado Ativo: Estatísticas + Botões de Entrega -->
    <div id="activeStateWrap" class="bottom-active-wrap" hidden>
      <!-- Cartão com estatísticas Total vs Entrega Atual -->
      <div class="ride-stats-card">
        <div class="stat-box">
          <small>TOTAL</small>
          <div class="stat-values"><b id="rideDistanceTotal">0,0 km</b> - <span id="rideTimeTotal">0m</span></div>
        </div>
        <div class="stat-divider">|</div>
        <div class="stat-box">
          <small>ENTREGA</small>
          <div class="stat-values"><b id="rideDistanceDelivery">0,0 km</b> - <span id="rideTimeDelivery">0m</span></div>
        </div>
      </div>

      <!-- Botões de ação na parte inferior -->
      <div class="bottom-actions-row">
        <button id="endRideBtn" class="bottom-btn end-btn" title="Encerrar">■</button>
        <button id="acceptDeliveryBtn" class="bottom-btn accept-btn">ACEITEI</button>
        <button id="retireDeliveryBtn" class="bottom-btn retire-btn">RETIREI</button>
        <button id="deliverDeliveryBtn" class="bottom-btn deliver-btn">ENTREGUEI</button>
        <button id="pauseRideBtn" class="bottom-btn pause-btn" title="Pausar">Ⅱ</button>
      </div>
    </div>
  </div>
