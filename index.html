<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132b26">
<meta name="description" content="GPS de bicicleta com mapa de altitude para a Zona Leste de São Paulo.">
<title>Altitude Bike GPS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- Mapa Fullscreen -->
  <div id="map" aria-label="Mapa interativo"></div>

  <!-- Janela Flutuante de Pesquisa -->
  <section class="floating-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <strong style="color:var(--dark); font-size:16px;">ALTITUDE <span>BIKE</span></strong>
      <button id="locateBtn" class="smallbtn" style="padding:6px 10px;" title="Minha localização" aria-label="Minha localização">📍 GPS</button>
    </div>
    <div class="field">
      <label for="origin">PONTO A · ORIGEM</label>
      <div class="inputrow"><input id="origin" placeholder="Use minha localização ou toque no mapa"><button id="originHere" class="smallbtn">GPS</button></div>
    </div>
    <div class="field" style="margin-top:8px;">
      <label for="destination">PONTO B · DESTINO</label>
      <div class="inputrow"><input id="destination" placeholder="Digite um endereço ou local"><button id="pickDest" class="smallbtn">MAPA</button></div>
      <div id="suggestions" class="suggestions"></div>
    </div>
    <div class="actions" style="margin-top:12px;">
      <button id="routeBtn" class="primary">CALCULAR ROTA</button>
      <button id="clearBtn" class="secondary">LIMPAR</button>
    </div>
    <div id="status" class="status">Pronto. Defina origem e destino para começar.</div>
    <div id="routeInfo" class="route-info" hidden></div>
    <div id="elevationInfo" class="elevation-card" hidden>
      <div class="elev-head"><b>COMPARADOR DE ALTITUDE</b><span id="elevSource">Mapzen / OpenTopoData</span></div>
      <div class="elev-grid"><div><small>SUA POSIÇÃO</small><strong id="currentElev">— m</strong></div><div><small>PONTO TOCADO</small><strong id="selectedElev">— m</strong></div></div>
      <div class="elev-diff"><small>DIFERENÇA</small><strong id="elevDiff">Toque em um ponto do mapa</strong></div>
    </div>
    <div class="hint">Dica: depois de calcular, toque em uma rua para inserir um ponto intermediário.</div>
  </section>

  <!-- Botões de Controle Flutuantes -->
  <div class="map-tools-floating">
    <button id="heatBtn" class="tool-btn active">🌡 Altitude</button>
    <button id="layersBtn" class="tool-btn">Camadas</button>
  </div>

  <!-- Legenda Flutuante -->
  <div id="legend" class="legend-floating">
    <b>ALTITUDE</b><div class="gradient"></div>
    <div class="legend-labels"><span>baixa (722m)</span><span>alta (820m)</span></div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="topo-layer.js"></script>
<script src="app.js"></script>
</body>
</html>
